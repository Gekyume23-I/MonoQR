<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{height:100%;margin:0;background:#000}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.t{position:absolute;left:0;right:0;top:1rem;text-align:center;color:#fff;font:900 clamp(1.8rem,9vw,3rem)/1.1 Impact,system-ui,sans-serif;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;text-transform:uppercase;padding:0 .5rem}
.coin{position:fixed;top:-2rem;font-size:2rem;animation:fall 2s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>
<img src="willi.jpg" alt="Gorila sacándote la peseta" id="m">
<div class="t">Maricon</div>
<script>
function rain(){for(let i=0;i<25;i++){const c=document.createElement('div');c.className='coin';c.textContent='🖕🏽';c.style.left=Math.random()*95+'vw';c.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2800);}}
document.getElementById('m').addEventListener('click',rain);
setTimeout(rain,400);
</script>
</body>
</html>
